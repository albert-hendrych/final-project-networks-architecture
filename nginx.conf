events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            # Redirige el tráfico internamente al contenedor que aloja tu web de la UPF
            proxy_pass http://mi-servidor-python:8000; 
            
            # Pasa las cabeceras de red originales (útil si monitorizas tráfico con Wireshark)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
